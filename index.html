<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="LittlePear's Personal Homepage" />
    <meta name="author" content="LittlePear" />
    <title>小梨的个人主页</title>

    <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />

    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Google fonts-->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,500;0,600;0,700;1,300;1,500;1,600;1,700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;1,400&amp;display=swap"
        rel="stylesheet" />

    <!-- Core theme CSS (includes Bootstrap)-->
    <link type="text/css" href="static/css/styles.css" rel="stylesheet" />
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />

    <!-- Bootstrap core JS-->
    <script type="text/javascript" src="static/js/bootstrap.bundle.min.js"></script>

    <!-- For Compatability -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    
    <!-- Markdown -->
    <script type="text/javascript" src="static/js/marked.min.js"></script>

    <!-- Mathematics -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: false,
                tags: 'all'
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

</head>

<body id="page-top">

    <!-- 左侧侧边栏 -->
    <div id="sidebar">
        <!-- 头像 -->
        <div id="sidebar-avatar">
            <img src="static/assets/img/photo.png" alt="LittlePear" />
        </div>
        <!-- 名字 -->
        <div id="sidebar-name">
            <span class="sidebar-name-zh">小梨</span>
            <span class="sidebar-name-en">曹培文-南京大学</span>
        </div>
        <!-- 导航链接 -->
        <nav id="sidebar-nav">
            <a class="sidebar-nav-link" href="#home">
                <i class="bi bi-house-fill"></i> 首页
            </a>
            <a class="sidebar-nav-link" href="#project">
                <i class="bi bi-folder2-open"></i> 项目经历
            </a>
            <a class="sidebar-nav-link" href="#gamejam">
                <i class="bi bi-controller"></i> GameJam
            </a>
            <a class="sidebar-nav-link" href="#skill">
                <i class="bi bi-tools"></i> 相关技能
            </a>
            <a class="sidebar-nav-link" href="#game">
                <i class="bi bi-dice-6-fill"></i> 游戏经历
            </a>
            <a class="sidebar-nav-link" href="#work">
                <i class="bi bi-award-fill"></i> 实习经历
            </a>
        </nav>

        <!-- 联系方式 -->
        <div id="sidebar-contact">
            <div class="contact-item">
                <i class="bi bi-envelope"></i>
                <span>xiaoningmeng1934@qq.com</span>
            </div>
            <div class="contact-item">
                <i class="bi bi-wechat"></i>
                <span>xiaoningmeng1934</span>
            </div>
            <div class="contact-item">
                <img src="static/assets/img/wechat-qrcode.jpg" alt="微信二维码" class="wechat-qrcode" />
            </div>
        </div>
    </div>

    <!-- 移动端顶部导航栏（小屏幕显示） -->
    <nav class="mobile-topnav" id="mobileNav">
        <span class="mobile-topnav-brand">小梨 · 曹培文-南京大学</span>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
            <i class="bi-list"></i>
        </button>
        <div class="mobile-menu-dropdown" id="mobileMenuDropdown">
            <a href="#home" onclick="closeMobileMenu()">首页</a>
            <a href="#project" onclick="closeMobileMenu()">项目经历</a>
            <a href="#gamejam" onclick="closeMobileMenu()">GameJam</a>
            <a href="#skill" onclick="closeMobileMenu()">相关技能</a>
            <a href="#game" onclick="closeMobileMenu()">游戏经历</a>
            <a href="#work" onclick="closeMobileMenu()">工作经历</a>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <div id="main-content">

        <!-- Top Section Banner -->
        <section class="top-section" style="background-image: url('static/assets/img/background.jpeg');">
            <div class="top-section-content">
                <div class="container px-5">
                    <h2 id="top-section-bg-text" class="text-white display-3 lh-1 font-alt">LittlePear</h2>
                </div>
            </div>
        </section>

        <!-- Home（首页，对应 home.md） -->
        <section class="bg-gradient-primary-to-secondary-light content-section" id="home">
            <div class="container px-5">
                <header>
                    <h2 id="home-subtitle">曹培文 | 游戏策划</h2>
                </header>
                <div class="main-body" id="home-md"></div>
            </div>
        </section>

        <!-- Project（项目经历，对应 Project.md） -->
        <section class="bg-gradient-primary-to-secondary-gray content-section" id="project">
            <div class="container px-5">
                <header>
                    <h2 id="project-subtitle"><i class="bi bi-folder2-open"></i>&nbsp;项目经历</h2>
                </header>
                <div class="main-body" id="project-md"></div>
            </div>
        </section>

        <!-- GameJam（GameJam，对应 GameJam.md） -->
        <section class="bg-gradient-primary-to-secondary-light content-section" id="gamejam">
            <div class="container px-5">
                <header>
                    <h2 id="gamejam-subtitle"><i class="bi bi-controller"></i>&nbsp;GameJam</h2>
                </header>
                <div class="main-body" id="gamejam-md"></div>
            </div>
        </section>

        <!-- Skill（相关技能，对应 Skill.md） -->
        <section class="bg-gradient-primary-to-secondary-light content-section" id="skill">
            <div class="container px-5">
                <header>
                    <h2 id="skill-subtitle"><i class="bi bi-tools"></i>&nbsp;相关技能</h2>
                </header>
                <div class="main-body" id="skill-md"></div>
            </div>
        </section>

        <!-- Game（游戏经历，对应 Game.md） -->
        <section class="bg-gradient-primary-to-secondary-gray content-section" id="game">
            <div class="container px-5">
                <header>
                    <h2 id="game-subtitle"><i class="bi bi-dice-6-fill"></i>&nbsp;游戏经历</h2>
                </header>
                <div class="main-body" id="game-md"></div>
            </div>
        </section>

        <!-- Work（工作经历，对应 Work.md） -->
        <section class="bg-gradient-primary-to-secondary-light content-section" id="work">
            <div class="container px-5">
                <header>
                    <h2 id="work-subtitle"><i class="bi bi-award-fill"></i>&nbsp;实习经历</h2>
                </header>
                <div class="main-body" id="work-md"></div>
            </div>
        </section>

        <!-- Footer-->
        <footer class="bg-bottom text-center py-5">
            <div class="container px-5">
                <div class="text-white-50 small">
                    <div id="copyright-text" class="mb-2">&copy; LittlePear 2025-2026. All Rights Reserved.</div>
                    <a id="github-link" href="https://github.com/CPW-LittlePear">Github</a>
                    <span class="mx-1">&middot;</span>
                    <a id="license-link" href="https://github.com/CPW-LittlePear/CPW-LittlePear.github.io/blob/main/LICENSE">License</a>
                </div>
            </div>
        </footer>

    </div><!-- /main-content -->

    <!-- 加载 Markdown 文件的核心 JS -->
    <script>
        // 加载 home.md 到首页
        fetch('contents/home.md')
            .then(response => {
                if (!response.ok) throw new Error('home.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('home-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 home.md 失败：', err));

        // 加载 Project.md 到项目经历板块
        fetch('contents/Project.md')
            .then(response => {
                if (!response.ok) throw new Error('Project.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('project-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 Project.md 失败：', err));

        // 加载 GameJam.md 到 GameJam 板块
        fetch('contents/GameJam.md')
            .then(response => {
                if (!response.ok) throw new Error('GameJam.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('gamejam-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 GameJam.md 失败：', err));

        // 加载 Skill.md 到相关技能板块
        fetch('contents/Skill.md')
            .then(response => {
                if (!response.ok) throw new Error('Skill.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('skill-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 Skill.md 失败：', err));

        // 加载 Game.md 到游戏经历板块
        fetch('contents/Game.md')
            .then(response => {
                if (!response.ok) throw new Error('Game.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('game-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 Game.md 失败：', err));

        // 加载 Work.md 到工作经历板块
        fetch('contents/Work.md')
            .then(response => {
                if (!response.ok) throw new Error('Work.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('work-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 Work.md 失败：', err));

        // 移动端菜单开关
        function toggleMobileMenu() {
            const dropdown = document.getElementById('mobileMenuDropdown');
            dropdown.classList.toggle('show');
        }
        function closeMobileMenu() {
            document.getElementById('mobileMenuDropdown').classList.remove('show');
        }

        // 侧边栏高亮当前章节
        const sections = document.querySelectorAll('section[id]');
        const navLinks = document.querySelectorAll('.sidebar-nav-link');
        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach(section => {
                if (window.scrollY >= section.offsetTop - 100) {
                    current = section.getAttribute('id');
                }
            });
            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === '#' + current) {
                    link.classList.add('active');
                }
            });
        });
    </script>

</body>
</html>
