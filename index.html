    <!-- 加载 Markdown 文件的核心 JS -->
    <script>
        // 开启 marked.js HTML 渲染（v5：自定义 renderer 阻止 HTML 被转义）
        const customRenderer = new marked.Renderer();
        customRenderer.image = function(href, title, text) {
            return `<img src="${href}" alt="${text}" title="${title || ''}" loading="lazy" />`;
        };
        marked.use({ renderer: customRenderer });

        // 加载 home.md 到首页
        fetch('contents/home.md')
            .then(response => {
                if (!response.ok) throw new Error('home.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('home-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 home.md 失败：', err));

        // 加载 campus.md 到校园经历板块
        fetch('contents/campus.md')
            .then(response => {
                if (!response.ok) throw new Error('campus.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('campus-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 campus.md 失败：', err));

        // 加载 Project.md 到项目经历板块
        fetch('contents/Project.md')
            .then(response => {
                if (!response.ok) throw new Error('Project.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('project-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 Project.md 失败：', err));

        // 加载 GameJam.md 到 GameJam 板块
        fetch('contents/GameJam.md')
            .then(response => {
                if (!response.ok) throw new Error('GameJam.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('gamejam-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 GameJam.md 失败：', err));

        // 加载 artwork.md 到作品集板块
        fetch('contents/artwork.md')
            .then(response => {
                if (!response.ok) throw new Error('artwork.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('artwork-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 artwork.md 失败：', err));

        // 加载 Skill.md 到相关技能板块
        fetch('contents/Skill.md')
            .then(response => {
                if (!response.ok) throw new Error('Skill.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('skill-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 Skill.md 失败：', err));

        // 加载 Game.md 到游戏经历板块
        fetch('contents/Game.md')
            .then(response => {
                if (!response.ok) throw new Error('Game.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('game-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 Game.md 失败：', err));

        // 加载 Work.md 到工作经历板块
        fetch('contents/Work.md')
            .then(response => {
                if (!response.ok) throw new Error('Work.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('work-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 Work.md 失败：', err));

        // 二维码放大
        function openQrcode(img) {
            document.getElementById('qrcode-overlay-img').src = img.src;
            document.getElementById('qrcode-overlay').classList.add('show');
        }
        function closeQrcode() {
            document.getElementById('qrcode-overlay').classList.remove('show');
        }

        // 复制文字
        function copyText(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const icon = btn.querySelector('i');
                icon.className = 'bi bi-check-lg';
                setTimeout(() => { icon.className = 'bi bi-clipboard'; }, 1500);
            });
        }

        // 超链接悬停提示（显示在链接下方）
        const tooltip = document.createElement('div');
        tooltip.className = 'link-tooltip';
        document.body.appendChild(tooltip);

        document.addEventListener('mouseover', function(e) {
            const link = e.target.closest('a[href][target="_blank"]');
            if (!link || link.title) return;
            tooltip.textContent = link.href;
            tooltip.classList.add('show');
        });

        document.addEventListener('mousemove', function(e) {
            if (!tooltip.classList.contains('show')) return;
            const x = e.clientX;
            const y = e.clientY + 18;
            tooltip.style.left = x + 'px';
            tooltip.style.top = y + 'px';
        });

        document.addEventListener('mouseout', function(e) {
            if (e.target.closest('a[href][target="_blank"]')) {
                tooltip.classList.remove('show');
            }
        });

        // 移动端菜单开关
        function toggleMobileMenu() {
            const dropdown = document.getElementById('mobileMenuDropdown');
            dropdown.classList.toggle('show');
        }
        function closeMobileMenu() {
            document.getElementById('mobileMenuDropdown').classList.remove('show');
        }

        // 侧边栏高亮当前章节
        const sections = document.querySelectorAll('section[id]');
        const navLinks = document.querySelectorAll('.sidebar-nav-link');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const id = entry.target.getAttribute('id');
                    navLinks.forEach(link => {
                        link.classList.remove('active');
                        if (link.getAttribute('href') === '#' + id) {
                            link.classList.add('active');
                        }
                    });
                }
            });
        }, {
            threshold: 0,
            rootMargin: '-10% 0px -80% 0px'
        });

        sections.forEach(section => observer.observe(section));

        // 导航链接强制瞬时跳转
        document.querySelectorAll('a[href^="#"]').forEach(link => {
            link.addEventListener('click', function(e) {
                const id = this.getAttribute('href').slice(1);
                const target = document.getElementById(id);
                if (target) {
                    e.preventDefault();
                    window.scrollTo(0, target.offsetTop);
                }
            });
        });
    </script>
