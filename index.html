<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="LittlePear's Personal Homepage" />
    <meta name="author" content="LittlePear" />
    <title>小梨的个人主页</title>

    <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico" />

    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Google fonts-->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;1,600&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,300;0,500;0,600;0,700;1,300;1,500;1,600;1,700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;1,400&amp;display=swap"
        rel="stylesheet" />

    <!-- Core theme CSS (includes Bootstrap)-->
    <link type="text/css" href="static/css/styles.css" rel="stylesheet" />
    <link type="text/css" href="static/css/main.css" rel="stylesheet" />

    <!-- Bootstrap core JS-->
    <script type="text/javascript" src="static/js/bootstrap.bundle.min.js"></script>

    <!-- For Compatability -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    
    <!-- Markdown -->
    <script type="text/javascript" src="static/js/marked.min.js"></script>

    <!-- Mathematics -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: false,
                tags: 'all'
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- 修复导航栏样式，避免按钮重叠 -->
    <style>
        .navbar-nav .nav-item {
            margin: 0 5px; /* 给导航按钮加间距，避免重叠 */
        }
        .navbar-nav .nav-link {
            white-space: nowrap; /* 防止文字换行 */
            padding: 8px 12px; /* 调整内边距，按钮更舒展 */
        }
        @media (max-width: 768px) {
            .navbar-nav .nav-item {
                margin: 5px 0; /* 移动端垂直排列，增加上下间距 */
            }
        }
    </style>
    
</head>

<body id="page-top">
    <!-- Navigation-->
    <nav class="header navbar navbar-expand-lg navbar-light fixed-top shadow-sm" id="mainNav">
        <div class="container px-5">
            <a id="page-top-title" class="navbar-brand fw-bold" href="#home">小梨 (LittlePear)</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive"
                aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                MENU
                <i class="bi-list"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto me-4 my-3 my-lg-0">
                    <!-- 拆分导航按钮，避免重叠 -->
                    <li class="nav-item">
                        <a class="nav-link me-lg-3" href="#home">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link me-lg-3" href="#project">项目经历</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link me-lg-3" href="#work">工作经历</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Top Section -->
    <section class="top-section" style="background-image: url('static/assets/img/background.jpeg');">
        <div class="top-section-content">
            <div class="container px-5">
                <h2 id="top-section-bg-text" class="text-white display-3 lh-1 font-alt">LittlePear</h2>
            </div>
        </div>
    </section>
    <!-- Top Section -->

    <!-- Photo -->
    <div class="container px-5">
        <div id="avatar">
            <img class="shadow" src="static/assets/img/photo.png">
        </div>
    </div>
    <!-- Photo -->
    
    <!-- Home（首页，对应 home.md） -->
    <section class="bg-gradient-primary-to-secondary-light mt5 md5" id="home">
        <div class="container px-5">
            <header>
                <h2 id="home-subtitle">小梨 | 游戏策划</h2>
            </header>
            <div class="main-body" id="home-md"></div>
        </div>
    </section>
    <!-- Home -->

    <!-- Project（项目经历，对应 Project.md） -->
    <section class="bg-gradient-primary-to-secondary-gray mt5 md5" id="project">
        <div class="container px-5">
            <header>
                <h2 id="project-subtitle"><i class="bi bi-file-text-fill"></i>&nbsp;项目经历</h2>
            </header>
            <div class="main-body" id="project-md"></div>
        </div>
    </section>
    <!-- Project -->

    <!-- Work（工作经历，对应 Work.md） -->
    <section class="bg-gradient-primary-to-secondary-light mt5 md5" id="work">
        <div class="container px-5">
            <header>
                <h2 id="work-subtitle"><i class="bi bi-award-fill"></i>&nbsp;工作经历</h2>
            </header>
            <div class="main-body" id="work-md"></div>
        </div>
    </section>
    <!-- Work -->

    <!-- Footer-->
    <footer class="bg-bottom text-center py-5">
        <div class="container px-5">
            <div class="text-white-50 small">
                <div id="copyright-text" class="mb-2">&copy; LittlePear 2025-2026. All Rights Reserved.</div>
                <a id="github-link" href="https://github.com/CPW-LittlePear">Github</a>
                <span class="mx-1">&middot;</span>
                <a id="license-link" href="https://github.com/CPW-LittlePear/CPW-LittlePear.github.io/blob/main/LICENSE">License</a>
            </div>
        </div>
    </footer>

    <!-- 加载 Markdown 文件的核心 JS -->
    <script>
        // 加载 home.md 到首页
        fetch('contents/home.md')
            .then(response => {
                if (!response.ok) throw new Error('home.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('home-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 home.md 失败：', err));

        // 加载 Project.md 到项目经历板块
        fetch('contents/Project.md')
            .then(response => {
                if (!response.ok) throw new Error('Project.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('project-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 Project.md 失败：', err));

        // 加载 Work.md 到工作经历板块
        fetch('contents/Work.md')
            .then(response => {
                if (!response.ok) throw new Error('Work.md 文件不存在');
                return response.text();
            })
            .then(text => {
                document.getElementById('work-md').innerHTML = marked.parse(text);
            })
            .catch(err => console.log('加载 Work.md 失败：', err));
    </script>

</body>
</html>
